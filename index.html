<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KirtanFX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    p {
      color: #888;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Coming Soon</h1>
    <p>Something is in the works.</p>
  </div>
</body>
</html>
